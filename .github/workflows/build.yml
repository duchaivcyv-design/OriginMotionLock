name: Build and Package Theos App

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Theos
      run: |
        git clone --recursive https://github.com/theos/theos.git $HOME/theos

    - name: Install ldid
      run: brew install ldid

    - name: Create and Fix Debian Control Scripts
      run: |
        mkdir -p debian
        rm -f debian/postinst
        echo -e "#!/bin/sh\nexit 0" > debian/postinst
        chmod 755 debian/postinst
        # Ép cấp lại quyền thực thi cho toàn bộ thư mục debian để tránh bị Theos ghi đè
        find debian -type f -exec chmod 755 {} +

    - name: Compile and Package
      run: |
        export THEOS=$HOME/theos
        make package

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: packages
        path: packages/*.deb
