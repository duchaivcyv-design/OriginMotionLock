name: Build and Package Theos App

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Theos
      run: |
        git clone --recursive https://github.com/theos/theos.git $HOME/theos

    - name: Install ldid
      run: brew install ldid

    - name: Fix script permissions
      run: |
        chmod +x debian/postinst || true
        # Nếu project của bạn có thêm các file script khác trong thư mục debian, hãy cấp quyền luôn cho chúng:
        [ -f debian/prerm ] && chmod +x debian/prerm || true
        [ -f debian/postrm ] && chmod +x debian/postrm || true
        [ -f debian/preinst ] && chmod +x debian/preinst || true

    - name: Compile and Package
      run: |
        export THEOS=$HOME/theos
        make package

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: packages
        path: packages/*.deb
