name: Build Tweak

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: sympathich/theos:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build Package
        run: make package

      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: deb-package
          path: packages/*.deb
