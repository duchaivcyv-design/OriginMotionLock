name: Build and Package Theos App

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Theos
      run: |
        git clone --recursive https://github.com/theos/theos.git $HOME/theos

    - name: Install ldid
      run: brew install ldid

    - name: Create and Fix Debian Control Scripts
      run: |
        mkdir -p debian
        rm -f debian/postinst debian/prerm debian/postinst debian/preinst
        echo -e "#!/bin/sh\nexit 0" > debian/postinst
        chmod 755 debian/postinst

    - name: Compile and Package
      run: |
        export THEOS=$HOME/theos
        # Chạy make stage trước để Theos sinh ra cấu trúc thư mục tạm, sau đó sửa quyền toàn bộ file script rồi mới gọi make package
        make stage || true
        find . -name "postinst" -exec chmod 755 {} +
        find . -name "prerm" -exec chmod 755 {} +
        find . -name "preinst" -exec chmod 755 {} +
        find . -name "postrm" -exec chmod 755 {} +
        make package
