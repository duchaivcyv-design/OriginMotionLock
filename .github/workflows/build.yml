name: Build Tweak

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Theos
        uses: malcommac/theos-action@v2 # Hoặc dùng action action chuẩn của Theos
        with:
          theos-url: 'https://github.com/theos/theos.git'

      - name: Build Package
        run: make package

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: packages/*.deb
