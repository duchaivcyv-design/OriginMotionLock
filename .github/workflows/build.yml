name: Build Tweak

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm dpkg-dev git make wget libssl-dev unzip curl

      - name: Install ldid manually
        run: |
          sudo wget -qO /usr/local/bin/ldid https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_linux_x86_64
          sudo chmod +x /usr/local/bin/ldid

      - name: Setup Theos, Toolchain and SDK
        run: |
          rm -rf $HOME/theos
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          
          mkdir -p $HOME/theos/toolchain/linux/iphone/bin
          
          ln -sf /usr/bin/clang $HOME/theos/toolchain/linux/iphone/bin/clang
          ln -sf /usr/bin/clang++ $HOME/theos/toolchain/linux/iphone/bin/clang++
          ln -sf /usr/bin/llvm-ar $HOME/theos/toolchain/linux/iphone/bin/ar
          ln -sf /usr/bin/llvm-strip $HOME/theos/toolchain/linux/iphone/bin/strip
          
          # Wrapper for lipo
          cat << 'EOF' > $HOME/theos/toolchain/linux/iphone/bin/lipo
          #!/bin/bash
          if command -v llvm-lipo &> /dev/null; then
            exec llvm-lipo "$@"
          elif [ -f /usr/lib/llvm-18/bin/llvm-lipo ]; then
            exec /usr/lib/llvm-18/bin/llvm-lipo "$@"
          elif [ -f /usr/lib/llvm-17/bin/llvm-lipo ]; then
            exec /usr/lib/llvm-17/bin/llvm-lipo "$@"
          else
            exec /usr/bin/llvm-lipo "$@"
          fi
          EOF
          chmod +x $HOME/theos/toolchain/linux/iphone/bin/lipo
          
          # Advanced wrapper for ld to handle -flavor darwin, version flags, and -arch mapping
          cat << 'EOF' > $HOME/theos/toolchain/linux/iphone/bin/ld
          #!/bin/bash
          NEW_ARGS=("-flavor" "darwin")
          while [[ $# -gt 0 ]]; do
            case "$1" in
              -iphoneos_version_min)
                NEW_ARGS+=("-platform_version" "ios" "$2" "$2")
                shift 2
                ;;
              -arch)
                NEW_ARGS+=("-arch" "$2")
                shift 2
                ;;
              *)
                NEW_ARGS+=("$1")
                shift
                ;;
            esac
          done
          exec /usr/bin/ld.lld "${NEW_ARGS[@]}"
          EOF
          chmod +x $HOME/theos/toolchain/linux/iphone/bin/ld
          
          rm -rf $HOME/theos/sdks
          git clone https://github.com/theos/sdks.git $HOME/theos/sdks --depth=1

            - name: Install Cephei Headers
        run: |
          rm -rf /tmp/Cephei
          git clone --depth=1 https://github.com/AdamDemasi/Cephei.git /tmp/Cephei
          mkdir -p $HOME/theos/include
          cp -r /tmp/Cephei/Cephei $HOME/theos/include/
          cp -r /tmp/Cephei/CepheiUI $HOME/theos/include/


      - name: Build Package
        env:
          THEOS: /home/runner/theos
        run: |
          make package

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: packages/*.deb
