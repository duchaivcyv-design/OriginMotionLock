name: Build Tweak

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang dpkg-dev git make wget libssl-dev unzip curl xz-utils

      - name: Install ldid manually
        run: |
          sudo wget -qO /usr/local/bin/ldid https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_linux_x86_64
          sudo chmod +x /usr/local/bin/ldid

      - name: Setup Theos and Toolchain
        run: |
          rm -rf $HOME/theos
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          
          # Tải toolchain Linux x86_64 chính chủ của Theos đặt đúng vào thư mục clang yêu cầu
          mkdir -p $HOME/theos/toolchain/linux
          git clone --depth=1 https://github.com/theos/toolchain.linux.x86_64.git $HOME/theos/toolchain/linux/iphone
          
          # Tải bộ SDK chuẩn
          rm -rf $HOME/theos/sdks
          git clone --depth=1 https://github.com/theos/sdks.git $HOME/theos/sdks

      - name: Build Package
        env:
          THEOS: /home/runner/theos
        run: |
          make package

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: packages/*.deb
