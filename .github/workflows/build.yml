name: Build Tweak

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang dpkg-dev git make wget libssl-dev unzip

      - name: Install ldid manually
        run: |
          sudo wget -qO /usr/local/bin/ldid https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_linux_x86_64
          sudo chmod +x /usr/local/bin/ldid

      - name: Setup Theos, Toolchain and SDK
        run: |
          rm -rf $HOME/theos
          # Clone Theos kèm theo tất cả các submodule bắt buộc (bao gồm toolchain)
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          
          # Cài đặt toolchain Linux cho Theos
          submodules=("toolchain/linux/iphone")
          for sub in "${submodules[@]}"; do
            git -C $HOME/theos submodule update --init --recursive "$sub" || true
          done
          
          # Xóa và tải chuẩn bộ SDK
          rm -rf $HOME/theos/sdks
          git clone https://github.com/theos/sdks.git $HOME/theos/sdks --depth=1

      - name: Build Package
        env:
          THEOS: /home/runner/theos
        run: |
          make package

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: packages/*.deb
