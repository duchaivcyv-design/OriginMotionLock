name: Build Tweak

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm dpkg-dev git make wget libssl-dev unzip curl

      - name: Install ldid manually
        run: |
          sudo wget -qO /usr/local/bin/ldid https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_linux_x86_64
          sudo chmod +x /usr/local/bin/ldid

      - name: Setup Theos, Toolchain and SDK
        run: |
          rm -rf $HOME/theos
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          
          mkdir -p $HOME/theos/toolchain/linux/iphone/bin
          
          ln -sf /usr/bin/clang $HOME/theos/toolchain/linux/iphone/bin/clang
          ln -sf /usr/bin/clang++ $HOME/theos/toolchain/linux/iphone/bin/clang++
          ln -sf /usr/bin/llvm-ar $HOME/theos/toolchain/linux/iphone/bin/ar
          ln -sf /usr/bin/llvm-strip $HOME/theos/toolchain/linux/iphone/bin/strip
          
          # Wrapper for lipo
          cat << 'EOF' > $HOME/theos/toolchain/linux/iphone/bin/lipo
          #!/bin/bash
          if command -v llvm-lipo &> /dev/null; then
            exec llvm-lipo "$@"
          elif [ -f /usr/lib/llvm-18/bin/llvm-lipo ]; then
            exec /usr/lib/llvm-18/bin/llvm-lipo "$@"
          elif [ -f /usr/lib/llvm-17/bin/llvm-lipo ]; then
            exec /usr/lib/llvm-17/bin/llvm-lipo "$@"
          else
            exec /usr/bin/llvm-lipo "$@"
          fi
          EOF
          chmod +x $HOME/theos/toolchain/linux/iphone/bin/lipo
          
          # Advanced wrapper for ld to handle -flavor darwin, version flags, and -arch mapping
          cat << 'EOF' > $HOME/theos/toolchain/linux/iphone/bin/ld
          #!/bin/bash
          NEW_ARGS=("-flavor" "darwin")
          while [[ $# -gt 0 ]]; do
            case "$1" in
              -iphoneos_version_min)
                NEW_ARGS+=("-platform_version" "ios" "$2" "$2")
                shift 2
                ;;
              -arch)
                NEW_ARGS+=("-arch" "$2")
                shift 2
                ;;
              *)
                NEW_ARGS+=("$1")
                shift
                ;;
            esac
          done
          exec /usr/bin/ld.lld "${NEW_ARGS[@]}"
          EOF
          chmod +x $HOME/theos/toolchain/linux/iphone/bin/ld
          
          rm -rf $HOME/theos/sdks
          git clone https://github.com/theos/sdks.git $HOME/theos/sdks --depth=1

      - name: Generate Global Headers & Fix Includes
        run: |
          mkdir -p $HOME/theos/include/Cephei $HOME/theos/include/CepheiUI $HOME/theos/include/Preferences
          
          cat << 'EOF' > $HOME/theos/include/Preferences/PSSpecifier.h
          #import <Foundation/Foundation.h>
          @interface PSSpecifier : NSObject
          + (instancetype)preferenceSpecifierNamed:(NSString *)title target:(id)target set:(SEL)set get:(SEL)get detail:(Class)detail cell:(Class)cell edit:(Class)edit;
          - (void)setProperty:(id)value forKey:(NSString *)key;
          - (id)propertyForKey:(NSString *)key;
          - (void)setAction:(SEL)action;
          @end
          @interface PSSwitchSpecifier : PSSpecifier
          @end
          #define PSGroupCell ((Class)0)
          #define PSSwitchCell ((Class)0)
          #define PSButtonCell ((Class)0)
          #define PSTitleValueCell ((Class)0)
          EOF

          cat << 'EOF' > $HOME/theos/include/Preferences/PSListController.h
          #import <UIKit/UIKit.h>
          #import <Preferences/PSSpecifier.h>
          @interface PSListController : UIViewController {
              NSMutableArray *_specifiers;
          }
          - (id)loadSpecifiersFromPlistName:(NSString *)name target:(id)target;
          - (NSMutableArray *)specifiers;
          - (void)reloadSpecifiers;
          @end
          EOF

          cat << 'EOF' > $HOME/theos/include/Preferences/PSSwitchTableCell.h
          #import <UIKit/UIKit.h>
          @interface PSSwitchTableCell : UITableViewCell
          @end
          EOF

          cat << 'EOF' > $HOME/theos/include/CepheiUI/HBListController.h
          #import <Preferences/PSListController.h>
          @interface HBListController : PSListController
          @end
          EOF

          cat << 'EOF' > $HOME/theos/include/Cephei/HBPreferences.h
          #import <Foundation/Foundation.h>
          @interface HBPreferences : NSObject
          - (instancetype)initWithIdentifier:(NSString *)identifier;
          - (id)objectForKey:(NSString *)key;
          - (id)objectForKey:(NSString *)key default:(id)defaultValue;
          - (void)setObject:(id)value forKey:(NSString *)key;
          - (BOOL)boolForKey:(NSString *)key;
          - (void)setBool:(BOOL)value forKey:(NSString *)key;
          - (BOOL)boolForKey:(NSString *)key default:(BOOL)defaultValue;
          @end
          EOF

          cat << 'EOF' > $HOME/theos/include/Cephei/HBNotificationCenter.h
          #import <Foundation/Foundation.h>
          #ifdef __cplusplus
          extern "C" {
          #endif
          void CPNotificationCenterPostNotification(NSString *name, BOOL deliverImmediately);
          #ifdef __cplusplus
          }
          #endif
          EOF

      - name: Build Package
        env:
          THEOS: /home/runner/theos
        run: |
          make package

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: packages/*.deb
